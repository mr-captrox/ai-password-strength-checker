<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Password Strength Checker</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="container">

    <h1><i class="fa-solid fa-shield-halved"></i> AI Password Strength Checker</h1>

    <div class="input-box">

        <input
        type="password"
        id="password"
        placeholder="Enter your password"
        onkeyup="checkPassword()">

        <span id="togglePassword">
            <i class="fa-solid fa-eye"></i>
        </span>

    </div>

    <div class="progress">
        <div id="strengthBar"></div>
    </div>

    <h2 id="strengthText">
        Strength :
        <span>None</span>
    </h2>

    <h3>Password Requirements</h3>

    <ul class="rules">

        <li id="length">
            ❌ At least 8 Characters
        </li>

        <li id="upper">
            ❌ One Uppercase Letter
        </li>

        <li id="lower">
            ❌ One Lowercase Letter
        </li>

        <li id="number">
            ❌ One Number
        </li>

        <li id="special">
            ❌ One Special Character
        </li>

    </ul>

    <div class="score">

        Password Score

        <span id="score">
            0%
        </span>

    </div>

    <div class="ai-box">

        <h3>
            🤖 AI Security Suggestion
        </h3>

        <p id="aiSuggestion">

            Enter a password to receive suggestions.

        </p>

    </div>

    <div class="buttons">

        <button onclick="generatePassword()">
            Generate Password
        </button>

        <button onclick="resetAll()">
            Reset
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
